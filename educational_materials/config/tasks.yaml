research_topic:
  description: >
    Conduct comprehensive research on the topic "{topic}" at {level} difficulty level.
    
    Use the provided URLs as reference sources: {urls}
    
    Your research should:
    1. Identify key concepts, definitions, and foundational knowledge
    2. Gather credible information appropriate for {level} learners
    3. Extract facts, examples, and real-world applications
    4. Note authoritative sources and references for citations
    5. Organize findings by conceptual themes
    
    Ensure all information is technically accurate, current, and suitable for educational use.
  expected_output: >
    A comprehensive research summary containing:
    - Key concepts and definitions for {topic}
    - Important facts and findings at {level} level
    - Real-world applications and examples
    - List of credible sources and references with URLs
    - Conceptual themes and knowledge areas
  agent: researcher

design_curriculum:
  description: >
    Based on the research findings about "{topic}", create a well-structured curriculum outline for {level} learners.
    
    Your curriculum should:
    1. Contain 3-10 distinct, logical learning sections/points
    2. Progress from foundational concepts to more advanced topics
    3. Each section must have a clear title and 2-3 sentence description
    4. Build progressively, where each section prepares for the next
    5. Be appropriate for the {level} difficulty level
    
    Ensure proper pedagogical sequencing and cognitive scaffolding.
  expected_output: >
    A structured curriculum outline with 3-10 sections, where each section includes:
    - Section number and title
    - 2-3 sentence description of content
    - Learning objectives implied by the description
    - Logical sequence building from basics to advanced
  agent: curriculum_designer

write_section:
  description: >
    Write comprehensive educational content for the section titled "{section_title}".
    
    Section Description: {section_description}
    Topic: {topic}
    Difficulty Level: {level}
    
    Your content should:
    1. Be written in Markdown format with proper headings and structure
    2. Provide 1000-2000 words of detailed, engaging educational content
    3. Include clear explanations, examples, and practical applications appropriate for {level} learners
    4. Use pedagogical techniques: definitions, analogies, step-by-step explanations, case studies
    5. Include at least 3-5 credible references or citations
    6. End with a "## References" section listing all sources with URLs where available
    7. Use clear language, short paragraphs, and bullet points where appropriate
    8. Include code examples or diagrams if applicable to the topic
    
    Ensure the content is accurate, well-organized, and engaging for the target learning level.
  expected_output: >
    A complete Markdown-formatted section containing:
    - Section title as H2 heading
    - Introduction paragraph
    - Main content divided into subsections (H3/H4 headings)
    - Examples, case studies, or practical applications
    - Key takeaways or summary
    - References section with citations and URLs
    - Professional formatting and consistent style
    - Approximately 1000-2000 words
  agent: content_writer
