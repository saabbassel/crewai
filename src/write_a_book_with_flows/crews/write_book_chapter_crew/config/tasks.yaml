research_chapter:
  description: >
    Research the provided section topic, title, and outline to gather additional content that will be helpful in writing the section.
    Ensure you focus on reliable, high-quality sources of information.

    Here is some additional information about the author's desired goal for the learning material and the section:\n\n {goal}
    Here is the outline description for the section:\n\n {chapter_description}

    When researching, consider the following key points:
    - you need to gather enough information to write a 3,000-word section
    - The section you are researching needs to fit in well with the rest of the sections in the learning material.

    Here is the outline of the entire learning material:\n\n
    {book_outline}
  expected_output: >
    A set of additional insights and information that can be used in writing the section.
  agent: researcher

write_chapter:
  description: >
    Write a well-structured section based on the section title, goal, and outline description. 
    Each section should be written in markdown and should contain around 3,000 words.

    Here is the topic for the learning material: {topic}
    Here is the title of the section: {chapter_title}
    Here is the outline description for the section:\n\n {chapter_description}

    Important notes:
    - The section you are writing needs to fit in well with the rest of the sections in the learning material.

    Here is the outline of the entire learning material:\n\n
    {book_outline}
  expected_output: >
    A markdown-formatted section of around 3,000 words that covers the provided section title and outline description.
  agent: writer
