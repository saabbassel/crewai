[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "educational-materials-generator"
version = "1.0.0"
description = "Multi-stage agentic educational materials generator using CrewAI"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Educational AI Team", email = "team@example.com"}
]

dependencies = [
    "crewai>=1.9.3",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "litellm>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "ruff>=0.1.0",
]

[project.urls]
Repository = "https://github.com/your-repo/educational-materials-generator"
Documentation = "https://github.com/your-repo/educational-materials-generator/wiki"

[tool.setuptools]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"
